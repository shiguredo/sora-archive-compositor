[package]
name = "sora-archive-compositor"
version = "2026.0.0"
edition = "2024"
rust-version = "1.98"
description = "Sora Archive Compositor"
readme = "README.md"
homepage = "https://github.com/shiguredo/sora-archive-compositor"
repository = "https://github.com/shiguredo/sora-archive-compositor"
license = "Apache-2.0"
exclude = ["docs/**", "testdata/**"]

# 間違って publish しないように当面は false にしておく
publish = false

[dependencies]
aws-lc-rs = "=1.18.1"
libc = "=0.2.189"
noargs = "=0.4.3"
nojson = "=0.3.15"
raden = "=2026.2.0"
shiguredo_dav1d = "=2026.2.0"
shiguredo_fdk_aac = { version = "=2026.1.0", optional = true }
shiguredo_libvpx = "=2026.2.0-canary.1"
shiguredo_libyuv = "=2026.2.0-canary.5"
shiguredo_mp4 = "=2026.5.0"
shiguredo_nvcodec = { version = "=2026.3.0-canary.0", optional = true }
shiguredo_openh264 = "=2026.2.0"
shiguredo_opus = "=2026.2.0"
shiguredo_svt_av1 = "=2026.2.0"
shiguredo_vmaf = "=2026.1.0"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["fmt", "std"] }

[dev-dependencies]
tempfile = "3.27.0"

[target.'cfg(target_os = "macos")'.dependencies]
shiguredo_audio_toolbox = "=2026.2.0-canary.0"
shiguredo_video_toolbox = "=2026.2.0-canary.2"

[features]
fdk-aac = ["shiguredo_fdk_aac"]
nvcodec = ["shiguredo_nvcodec"]
