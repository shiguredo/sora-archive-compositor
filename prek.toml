# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

# prek 独自の機能 (builtin repo, glob files, priority) を使うため最低バージョンを明示する
minimum_prek_version = "0.3.9"

# 最初に失敗したフックで残りをスキップする
fail_fast = true
# stages 未指定のフックは pre-commit でだけ実行される
default_stages = ["pre-commit"]
# prek install で pre-commit と pre-push の両方の Git フックを入れる
default_install_hook_types = ["pre-commit", "pre-push"]
exclude = {
  glob = [
    "target/**",
  ]
}

# 設定の整合性チェック
[[repos]]
repo = "meta"
hooks = [{ id = "check-hooks-apply" }]

# prek 組み込みフック (オフラインで動作する Rust ネイティブ実装)
[[repos]]
repo = "builtin"
hooks = [
  # NOTE: 破壊系フック (trailing-whitespace / end-of-file-fixer / fix-byte-order-marker /
  # mixed-line-ending) は書き換えで hisui 2025.3.2 由来の bit-perfect を壊すため、
  # testdata/** を exclude する。非破壊系フックは testdata/ も対象にしてよい。
  # 行末の空白を取り除く
  { id = "trailing-whitespace", exclude = { glob = ["testdata/**"] } },
  # ファイル末尾を改行 1 つで終わらせる
  { id = "end-of-file-fixer", exclude = { glob = ["testdata/**"] } },
  # ファイル先頭の UTF-8 BOM を取り除く
  { id = "fix-byte-order-marker", exclude = { glob = ["testdata/**"] } },
  # TOML の構文エラーを検出する
  { id = "check-toml" },
  # YAML の構文エラーを検出する
  { id = "check-yaml" },
  # JSON の構文エラーと重複キーを検出する
  # testdata/layouts/error-*.json は意図的な不正 JSON (テスト用エラーケース) で fail するため除外する
  {
    id = "check-json",
    exclude = { glob = ["testdata/layouts/error-*.json"] }
  },
  # マージコンフリクトマーカーが残ったコミットを防ぐ
  { id = "check-merge-conflict" },
  # 大文字小文字だけが異なるファイル名の衝突を防ぐ
  { id = "check-case-conflict" },
  # 大きなファイルの誤コミットを防ぐ
  { id = "check-added-large-files" },
  # 秘密鍵の誤コミットを防ぐ
  { id = "detect-private-key" },
  # 改行コードの混在を防ぐ
  { id = "mixed-line-ending", exclude = { glob = ["testdata/**"] } },
  # リンク切れのシンボリックリンクを検出する
  { id = "check-symlinks" },
  # シンボリックリンクだったファイルが実体ファイルとしてコミットされるのを検出する
  { id = "destroyed-symlinks" },
  # shebang 付きスクリプトに実行権限があるか確認する
  # Rust の inner attribute #![...] が shebang と誤判定されるため Rust ファイルは除外する
  { id = "check-shebang-scripts-are-executable", exclude_types = ["rust"] },
  # NOTE: check-executables-have-shebangs は現状 sora-archive-compositor に
  # executable がなく check-hooks-apply が「対象なし」で fail するので撤去してある。
  # shebang 付きの実行可能ファイルを追加したときに再追加する。
]

# tombi: TOML のフォーマッタ・リンタ
# rev は prek auto-update で更新する
[[repos]]
repo = "https://github.com/tombi-toml/tombi-pre-commit"
rev = "v1.2.6"
hooks = [
  # Cargo.lock は自動生成ファイルなので tombi の対象外にする
  { id = "tombi-lint", exclude = { glob = "**/Cargo.lock" } },
  { id = "tombi-format", exclude = { glob = "**/Cargo.lock" } },
]

# プロジェクト固有のローカルフック
# priority が小さいほど先に実行される。同じ priority なら並列実行される
[[repos]]
repo = "local"

# --all でワークスペース全体を対象にし、--check で書き換えずに未フォーマットを検出だけする
[[repos.hooks]]
id = "cargo-fmt"
name = "cargo fmt"
entry = "cargo fmt --all -- --check"
language = "system"
types = ["rust"]
pass_filenames = false
priority = 0

# --workspace --all-targets でテスト・example・ベンチも lint し、-D warnings で警告をエラーに昇格する
[[repos.hooks]]
id = "cargo-clippy"
name = "cargo clippy"
entry = "cargo clippy --workspace --all-targets -- -D warnings"
language = "system"
types = ["rust"]
pass_filenames = false
priority = 10

# cargo test: コミットを遅くしないため pre-push でだけ実行する
[[repos.hooks]]
id = "cargo-test"
name = "cargo test"
entry = "cargo test --workspace"
language = "system"
types = ["rust"]
pass_filenames = false
stages = ["pre-push"]
priority = 20
